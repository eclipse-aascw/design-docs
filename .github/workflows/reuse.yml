name: REUSE compliance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  reuse-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reuse
        run: pip install reuse==6.3.0

      - name: Run reuse lint
        run: reuse lint
