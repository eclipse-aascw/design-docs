name: Publish to gh-pages

on:
  push:
    branches:
      - master
      - main

jobs:
  Publish:
    # NOTE (aaronzi, 2026-11-05):
    # ubuntu-latest (26.04) does not provide Python 3.8 anymore, so we pin
    # the runner to keep building with Python 3.8.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build
      run: |
        python build.py --output html-for-gh-pages

    - name: Deploy to gh-pages 🚀
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: html-for-gh-pages
